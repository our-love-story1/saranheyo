<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Хөөрөнөө болзоонд урьж байна  💕</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ffdce8;
    overflow:hidden;
}

.card{
    width:90%;
    max-width:400px;
    background:white;
    border-radius:30px;
    padding:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
    z-index:2;
}

h1{
    color:#ff4081;
    font-size:35px;
}

img{
    width:130px;
}

button{
    border:none;
    border-radius:30px;
    cursor:pointer;
    transition:.3s;
}

#yes,#no{
    width:130px;
    height:55px;
    font-size:20px;
    margin:10px;
}

#yes{
    background:#ff4081;
    color:white;
}

#no{
    background:#e5e5e5;
}

#musicBtn{
    background:#ffc0cb;
    padding:12px 25px;
    margin-top:10px;
}

#message{
    color:#ff4081;
    min-height:30px;
    font-weight:bold;
}

#dateBox{
    display:none;
    margin-top:20px;
}

input{
    width:100%;
    padding:12px;
    border-radius:15px;
    border:1px solid #ddd;
    font-size:16px;
}

#countdown{
    color:#ff4081;
    margin-top:15px;
}

.heart{
    position:fixed;
    animation:fly 5s linear forwards;
    pointer-events:none;
}

@keyframes fly{
    from{
        transform:translateY(0);
        opacity:1;
    }
    to{
        transform:translateY(-120vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="card">

<img src="https://cdn-icons-png.flaticon.com/512/616/616430.png">

<h1>🌸 Надтай болзоонд явах уу? 🌸</h1>

<p id="message"></p>

<div>
<button id="yes">ТИЙМ 💕</button>
<button id="no">ҮГҮЙ 😅</button>
</div>

<button id="musicBtn">🎵 Хөгжим асаах</button>

<div id="dateBox">
<h3>📅 Болзооны өдөр, цагаа сонго</h3>

<input type="datetime-local" id="dateInput">

<h3 id="countdown"></h3>
</div>

</div>

<script>

// ❤️ Нисдэг зүрх
setInterval(()=>{
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(20+Math.random()*20)+"px";
    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },5000);

},700);


// 🎵 Хөгжим
const music = new Audio(
'https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0f5f7df16.mp3'
);

music.loop=true;

musicBtn.onclick=()=>{
    music.play();
    musicBtn.style.display='none';
};


// 😅 ҮГҮЙ товч
const messages=[
"Яагаад? 🥺",
"Дахиад бод доо 😭",
"Гуйя аа ❤️",
"Нэг л удаа шүү 🥰",
"Кофе уух уу? ☕",
"Зайрмаг идэх үү? 🍦",
"За тэгвэл ТИЙМ дараач 😘"
];

let count=0;
let noScale=1;
let yesScale=1;

no.onclick=()=>{

    message.innerText =
        messages[Math.min(count,messages.length-1)];

    noScale -= 0.1;
    if(noScale < 0.5){
        noScale = 0.5;
    }

    yesScale += 0.08;
    if(yesScale > 1.5){
        yesScale = 1.5;
    }

    no.style.transform=`scale(${noScale})`;
    yes.style.transform=`scale(${yesScale})`;

    count++;
};


// 💕 ТИЙМ
yes.onclick=()=>{
    dateBox.style.display='block';
};


// ⏳ Countdown
setInterval(()=>{

    const value =
        document.getElementById('dateInput').value;

    if(!value){
        countdown.innerHTML='';
        return;
    }

    const target=new Date(value);
    const now=new Date();

    const diff=target-now;

    if(diff<=0){
        countdown.innerHTML=
            '🎉 Болзооны цаг боллоо! ❤️';
        return;
    }

    const days=
        Math.floor(diff/(1000*60*60*24));

    const hours=
        Math.floor((diff%(1000*60*60*24))
        /(1000*60*60));

    const minutes=
        Math.floor((diff%(1000*60*60))
        /(1000*60));

    const seconds=
        Math.floor((diff%(1000*60))/1000);

    countdown.innerHTML=
    `❤️ Болзоо хүртэл<br>
    ${days} өдөр ${hours} цаг
    ${minutes} минут ${seconds} секунд`;

},1000);

</script>

</body>
</html>
