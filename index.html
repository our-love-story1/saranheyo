<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Date with Namuunzul ❤️</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd1dc,#ffeef5);
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.card{
    background:white;
    width:90%;
    max-width:420px;
    padding:30px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 10px 35px rgba(0,0,0,.15);
    z-index:10;
}

h1{
    color:#ff4f81;
    margin-bottom:10px;
}

h2{
    color:#555;
    font-size:20px;
}

#catGif{
    width:180px;
    margin:15px 0;
}

.option{
    background:#fff5f7;
    margin:10px 0;
    padding:14px;
    border-radius:15px;
    text-align:left;
}

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
    flex-wrap:wrap;
}

button{
    border:none;
    background:#ff5b8a;
    color:white;
    padding:14px 24px;
    border-radius:30px;
    cursor:pointer;
    font-size:17px;
}

button:hover{
    transform:scale(1.05);
}

#success{
    display:none;
}

#countdown{
    color:#ff4f81;
    font-size:22px;
    margin-top:20px;
}

.heart{
    position:absolute;
    top:-50px;
    font-size:25px;
    animation:fall 6s linear infinite;
}

@keyframes fall{
    to{
        transform:translateY(120vh);
    }
}

@media(max-width:500px){

    .card{
        padding:22px;
    }

    h1{
        font-size:28px;
    }

    h2{
        font-size:18px;
    }

    button{
        width:120px;
    }
}
</style>
</head>
<body>

<div class="card" id="mainCard">

    <h1>💕 Namuunzul 💕</h1>

    <img
    id="catGif"
    src="https://media.tenor.com/4K5JqfKq4N8AAAAi/cute-cat.gif">

    <h2>Will you go on a date with me?</h2>

    <div class="option">
        <input type="radio" name="date"
        value="July 2 2026 18:00">
        Jul 2 - 18:00
    </div>

    <div class="option">
        <input type="radio" name="date"
        value="July 3 2026 19:00">
        Jul 3 - 19:00
    </div>

    <div class="option">
        <input type="radio" name="date"
        value="July 5 2026 17:00">
        Jul 5 - 17:00
    </div>

    <div class="option">
        <input type="radio" name="date"
        value="July 6 2026 20:00">
        Jul 6 - 20:00
    </div>

    <div class="option">
        <input type="radio" name="date"
        value="July 8 2026 18:30">
        Jul 8 - 18:30
    </div>

    <div class="buttons">
        <button id="noBtn">No 😢</button>
        <button onclick="confirmDate()">
            Yes ❤️
        </button>
    </div>

</div>

<div class="card" id="success">

    <h1>🎉 Date Confirmed! 🎉</h1>

    <h2>Thank you Namuunzul ❤️</h2>

    <p id="selectedDate"></p>

    <div id="countdown"></div>

</div>

<audio id="music">
<source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3">
</audio>

<script>

emailjs.init("YOUR_PUBLIC_KEY");

const noBtn =
document.getElementById("noBtn");

function moveNoButton(){

    const x =
    Math.random() *
    (window.innerWidth-120);

    const y =
    Math.random() *
    (window.innerHeight-70);

    noBtn.style.position="fixed";
    noBtn.style.left=x+"px";
    noBtn.style.top=y+"px";
}

noBtn.addEventListener(
"mouseover",
moveNoButton
);

noBtn.addEventListener(
"touchstart",
moveNoButton
);

function confirmDate(){

    let selected =
    document.querySelector(
    'input[name="date"]:checked'
    );

    if(!selected){
        alert("Choose a date ❤️");
        return;
    }

    const value =
    selected.value;

    document.getElementById(
    "mainCard"
    ).style.display="none";

    document.getElementById(
    "success"
    ).style.display="block";

    document.getElementById(
    "selectedDate"
    ).innerHTML=
    "📅 Our Date:<br><b>"+value+
    "</b>";

    confetti({
        particleCount:300,
        spread:180,
        origin:{y:0.6}
    });

    createHearts();

    document.getElementById(
    "music"
    ).play();

    startCountdown(
        new Date(value)
    );

    emailjs.send(
        "YOUR_SERVICE_ID",
        "YOUR_TEMPLATE_ID",
        {
            to_email:
            "chingesc2@gmail.com",

            message:
            "Namuunzul selected: "
            +value
        }
    );
}

function startCountdown(date){

    setInterval(function(){

        let now =
        new Date().getTime();

        let distance =
        date-now;

        if(distance<=0){

            document.getElementById(
            "countdown"
            ).innerHTML=
            "❤️ It's Date Time! ❤️";

            return;
        }

        let days =
        Math.floor(
        distance/
        (1000*60*60*24));

        let hours =
        Math.floor(
        (distance%
        (1000*60*60*24))
        /(1000*60*60));

        let minutes =
        Math.floor(
        (distance%
        (1000*60*60))
        /(1000*60));

        let seconds =
        Math.floor(
        (distance%
        (1000*60))
        /1000);

        document.getElementById(
        "countdown"
        ).innerHTML=
        "⏳ "+
        days+" days "+
        hours+"h "+
        minutes+"m "+
        seconds+"s ❤️";

    },1000);
}

function createHearts(){

    setInterval(function(){

        const heart =
        document.createElement("div");

        heart.className=
        "heart";

        heart.innerHTML="❤️";

        heart.style.left=
        Math.random()*100+
        "vw";

        heart.style.fontSize=
        (20+
        Math.random()*25)
        +"px";

        document.body.appendChild(
        heart
        );

        setTimeout(()=>{
            heart.remove();
        },6000);

    },250);
}
</script>

</body>
</html>
