<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Намуунзул ❤️</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:linear-gradient(to bottom,#ffe4ec,#fff7fa);
    font-family:Arial,sans-serif;
}

.container{
    width:100%;
    height:100vh;
    position:relative;
}

.slide{
    position:absolute;
    top:50%;
    left:50%;

    width:80%;
    max-width:850px;

    text-align:center;

    color:#8b004f;

    font-size:30px;
    line-height:1.8;

    opacity:0;

    transform:
        translate(-50%,-50%)
        translateY(40px);

    transition:all 2s ease;
}

.slide.show{

    opacity:1;

    transform:
        translate(-50%,-50%)
        translateY(0);
}

.slide.hide{

    opacity:0;

    transform:
        translate(-50%,-50%)
        translateY(-30px);
}

.final{

    font-size:52px;

    font-weight:bold;

    color:#ff4081;
}

#continueBtn{

    display:none;

    position:absolute;

    bottom:80px;

    left:50%;

    transform:translateX(-50%);

    padding:15px 35px;

    border:none;

    border-radius:30px;

    background:#ff69b4;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:0.3s;
}

#continueBtn:hover{

    transform:
        translateX(-50%)
        scale(1.05);
}


/* 🌸 Сакура */

.sakura{

    position:fixed;

    top:-50px;

    font-size:25px;

    animation:fall linear forwards;

    pointer-events:none;
}

@keyframes fall{

    from{

        transform:
        translateY(-50px)
        rotate(0deg);
    }

    to{

        transform:
        translateY(110vh)
        rotate(360deg);
    }
}

</style>

</head>

<body>

<div class="container">

    <div id="story"></div>

    <button id="continueBtn">

        🌸 Түүхийг үргэлжлүүлэх 🌸

    </button>

</div>


<script>

const slides = [

`2022 оны хаврын нэгэн өдөр...

Хаан банкны АТМ-ийн өмнө би чамайг анх харж билээ.`,

`"Ямар хөөрхөн охин бэ..." гэж бодсон тэрхэн мөч миний амьдралыг бүхэлд нь өөрчилнө гэж би төсөөлөөгүй.`,

`Гэхдээ өнөөдөр эргээд бодоход,

тэр өдөр миний амьдралын хамгийн сайхан түүхийн эхлэл байсан юм шиг санагддаг.`,

`Учир нь тэр үеэс хойш чи миний өдрүүдийг илүү гэрэлтэй,

инээмсэглэлийг минь илүү чин сэтгэлийн болгосон.`,

`Тэр үед би зүгээр л нэг хөөрхөн охиныг харсан гэж бодсон.

Гэвч үнэндээ би өөрийнхөө хамгийн нандин хүнийг олж харсан байжээ.`,

`Намуунзул... ❤️`

];


let current = 0;


function showSlide(){

    if(current >= slides.length){

        document.getElementById("continueBtn")
            .style.display = "block";

        return;
    }


    const div = document.createElement("div");

    div.className = "slide";

    if(current === slides.length - 1){

        div.classList.add("final");
    }


    div.innerHTML =
        slides[current]
        .replace(/\n/g,"<br>");


    document.getElementById("story")
        .appendChild(div);


    setTimeout(()=>{

        div.classList.add("show");

    },100);


    setTimeout(()=>{

        div.classList.remove("show");

        div.classList.add("hide");


        setTimeout(()=>{

            div.remove();

            current++;

            showSlide();

        },2000);


    },5000);
}


showSlide();


// 🌸 Сакура унагах

setInterval(()=>{

    const petal =
        document.createElement("div");

    petal.className = "sakura";

    petal.innerHTML = "🌸";


    petal.style.left =
        Math.random()*100 + "vw";


    petal.style.animationDuration =
        (5 + Math.random()*5) + "s";


    document.body.appendChild(petal);


    setTimeout(()=>{

        petal.remove();

    },10000);


},500);

</script>
<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Slide 2 ❤️</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:linear-gradient(to bottom,#ffe4ec,#fff7fa);
    font-family:Arial,sans-serif;
}

.container{
    width:100%;
    height:100vh;
    position:relative;

.slide{
    position:absolute;
    top:50%;

    max-width:850px;

    text-align:center;

    color:#8b004f;

    font-size:30px;
    line-height:1.8;

    opacity:0;

    transform:
        translate(-50%,-50%)
        translateY(40px);

    transition:all 2s ease;
}

.slide.show{

    opacity:1;

    transform:
        translate(-50%,-50%)
        translateY(0);
}

.slide.hide{

    opacity:0;

    transform:
        translate(-50%,-50%)
        translateY(-30px);
}

#continueBtn{

    display:none;

    position:absolute;

    bottom:80px;

    left:50%;

    transform:translateX(-50%);

    padding:15px 35px;

    border:none;

    border-radius:30px;

    background:#ff69b4;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:0.3s;
}

#continueBtn:hover{

    transform:
        translateX(-50%)
        scale(1.05);
}


/* 🌸 Сакура */

.sakura{

    position:fixed;

    top:-50px;

    font-size:25px;

    animation:fall linear forwards;

    pointer-events:none;
}

@keyframes fall{

    from{

        transform:
        translateY(-50px)
        rotate(0deg);
    }

    to{

        transform:
        translateY(110vh)
        rotate(360deg);
    }
}

</style>

</head>

<body>

<div class="container">

    <div id="story"></div>

    <button id="continueBtn">

        🌸 Дараах 🌸

    </button>

</div>


<script>

const slides = [

    {
        text: "Сайн уу, хайрт минь ❤️",
        duration: 2000
    },

    {
        text: "Тэр хаврын өдрөөс хойш миний ертөнц бага багаар өөрчлөгдөж эхэлсэн.",
        duration: 3000
    },

    {
        text: "Чамтай өнгөрүүлсэн жирийн мэт санагдах мөчүүд хүртэл өнөөдөр миний хамгийн нандин дурсамжууд болсон.",
        duration: 3000
    },

    {
        text: `Чиний инээмсэглэл намайг тайвшруулж,<br><br>
        Чиний халамж намайг аз жаргалтай болгож,<br><br>
        Чиний хажууд байх бүртээ би өөрийгөө хамгийн азтай хүн мэт мэдэрдэг.`,
        duration: 4000
    },

    {
        text: "Магадгүй амьдралд төгс зүйл гэж байдаггүй байх.",
        duration: 4000
    },

    {
        text: "Гэхдээ чамтай хамт өнгөрүүлэх мөч бүр миний хувьд төгс байдаг. ❤️",
        duration: 2000
    }

];


let current = 0;


function showSlide(){

    const slideData = slides[current];

    const div =
        document.createElement("div");

    div.className = "slide";

    div.innerHTML = slideData.text;

    document
        .getElementById("story")
        .appendChild(div);


    setTimeout(()=>{

        div.classList.add("show");

    },100);


    setTimeout(()=>{

        // Сүүлийн текст биш бол
        if(current < slides.length - 1){

            div.classList.remove("show");

            div.classList.add("hide");


            setTimeout(()=>{

                div.remove();

                current++;

                showSlide();

            },2000);
        }

        // Сүүлийн текст бол үлдээнэ
        else{

            setTimeout(()=>{

                document
                    .getElementById("continueBtn")
                    .style.display = "block";

            },1000);
        }

    },slideData.duration);
}


showSlide();




// 🌸 Сакура унагах

setInterval(()=>{

    const petal =
        document.createElement("div");

    petal.className = "sakura";

    petal.innerHTML = "🌸";

    petal.style.left =
        Math.random()*100 + "vw";

    petal.style.animationDuration =
        (5 + Math.random()*5) + "s";

    document.body.appendChild(petal);


    setTimeout(()=>{

        petal.remove();

    },10000);


},500);

</script>

</body>
</html>
